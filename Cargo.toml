[package]
name = "canvas"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "canvas"
path = "src/main.rs"

[dependencies]
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = "0.11"
jpeg-encoder = "0.6"
miniz_oxide = "0.8"
ureq = { version = "2", default-features = false }
