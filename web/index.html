<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Paint</title>
<style>
:root{--bg:#ececec;--tb:rgba(242,242,242,.78);--hair:rgba(0,0,0,.12);--text:#1d1d1f;--icon:rgba(0,0,0,.68);--text2:rgba(0,0,0,.5);--hover:rgba(0,0,0,.06);--press:rgba(0,0,0,.11);--accent:#007aff;--ws:#d6d6d6;--seg:rgba(0,0,0,.07);--segon:#fff;--menu:rgba(246,246,246,.9);--grip:rgba(0,0,0,.28);--ring:rgba(0,0,0,.16)}
@media (prefers-color-scheme:dark){:root{--bg:#1e1e1e;--tb:rgba(44,44,46,.78);--hair:rgba(0,0,0,.55);--text:#f5f5f7;--icon:rgba(255,255,255,.78);--text2:rgba(255,255,255,.5);--hover:rgba(255,255,255,.08);--press:rgba(255,255,255,.14);--accent:#0a84ff;--ws:#262626;--seg:rgba(255,255,255,.08);--segon:#636366;--menu:rgba(40,40,42,.9);--grip:rgba(255,255,255,.35);--ring:rgba(255,255,255,.2)}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:13px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
#tb{position:fixed;top:0;left:0;right:0;height:52px;z-index:10;display:flex;align-items:center;gap:14px;padding:0 12px;background:var(--tb);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--hair)}
.grp{display:flex;align-items:center;gap:2px}
.sp{flex:1}
button{font:inherit;color:inherit}
.b{height:28px;min-width:30px;padding:0 6px;border:0;border-radius:6px;background:transparent;color:var(--icon);display:inline-flex;align-items:center;justify-content:center;gap:2px;cursor:default}
.b:hover{background:var(--hover)}
.b:active,.b.open{background:var(--press)}
.b:disabled{opacity:.3;background:transparent}
svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.b svg.chev{width:10px;height:10px;stroke-width:2.2;margin-left:1px}
.seg{display:inline-flex;padding:2px;border-radius:7px;background:var(--seg)}
.seg .b{height:24px;width:36px;min-width:0;border-radius:5px}
.seg .b.on{background:var(--segon);color:var(--text);box-shadow:0 .5px 1.5px rgba(0,0,0,.22),0 0 0 .5px rgba(0,0,0,.05)}
.sw{width:16px;height:16px;border-radius:50%;border:0;padding:0;margin:0 3px;box-shadow:inset 0 0 0 .5px var(--ring);cursor:default}
.sw.on{box-shadow:inset 0 0 0 .5px var(--ring),0 0 0 2px var(--bg),0 0 0 3.5px var(--accent)}
input[type=color]{-webkit-appearance:none;appearance:none;width:28px;height:20px;margin-left:6px;padding:0;border:.5px solid var(--ring);border-radius:5px;background:var(--segon);cursor:default}
input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
input[type=color]::-webkit-color-swatch{border:0;border-radius:3px}
input[type=color]::-moz-color-swatch{border:0;border-radius:3px}
input[type=range]{width:110px;accent-color:var(--accent);margin:0 6px 0 0}
.ro{color:var(--text2);font-variant-numeric:tabular-nums;min-width:38px}
#zoom{min-width:50px;font-variant-numeric:tabular-nums;color:var(--text)}
#dims{color:var(--text2);font-variant-numeric:tabular-nums;margin-right:4px}
#ws{position:absolute;inset:0;overflow:auto;background:var(--ws);padding-top:52px}
#stage{display:flex;min-width:100%;min-height:100%;width:max-content;padding:56px}
#frame{position:relative;margin:auto;flex:none;box-shadow:0 1px 3px rgba(0,0,0,.16),0 10px 30px rgba(0,0,0,.14)}
#frame canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#over{touch-action:none;cursor:crosshair}
.handle{position:absolute;z-index:3;touch-action:none}
.hl,.hr{top:0;bottom:0;width:10px;cursor:ew-resize}.hl{left:-10px}.hr{right:-10px}
.ht,.hb{left:0;right:0;height:10px;cursor:ns-resize}.ht{top:-10px}.hb{bottom:-10px}
.handle::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:2px;background:var(--grip);opacity:0;transition:opacity .15s}
.hl::after,.hr::after{width:3px;height:28px}.ht::after,.hb::after{width:28px;height:3px}
#frame:hover .handle::after{opacity:1}
.handle:hover::after{background:var(--accent)}
#outline{position:absolute;display:none;z-index:4;pointer-events:none;border:1px solid var(--accent);background:rgba(0,122,255,.06)}
#outline span{position:absolute;right:4px;bottom:4px;padding:2px 6px;border-radius:4px;background:var(--accent);color:#fff;font-size:11px;font-variant-numeric:tabular-nums}
#prog{position:fixed;top:52px;left:0;right:0;height:2px;z-index:11;display:none}
#bar{height:100%;width:0;background:var(--accent)}
#menu{position:fixed;z-index:20;display:none;min-width:180px;padding:5px;border-radius:8px;background:var(--menu);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);box-shadow:0 0 0 .5px var(--hair),0 8px 28px rgba(0,0,0,.22)}
#menu button{display:flex;width:100%;height:22px;padding:0 10px;border:0;border-radius:4px;background:transparent;align-items:center;text-align:left;cursor:default}
#menu button:hover{background:var(--accent);color:#fff}
#menu kbd{margin-left:auto;font:inherit;opacity:.5}
#menu button:hover kbd{opacity:.8}
@media (max-width:900px){input[type=range]{width:70px}.sw:nth-of-type(n+6){display:none}#dims{display:none}}
</style>
</head>
<body>
<div id="tb">
  <div class="grp">
    <button class="b" id="newB" title="New"><svg viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M9 15h6"/><path d="M12 18v-6"/></svg></button>
    <button class="b" id="openB" title="Open Project (⌘O)"><svg viewBox="0 0 24 24"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/></svg></button>
    <button class="b" id="saveB" title="Save Project (⌘S)"><svg viewBox="0 0 24 24"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/></svg></button>
  </div>
  <div class="seg">
    <button class="b on" id="brushB" title="Brush (B)"><svg viewBox="0 0 24 24"><path d="m9.06 11.9 8.07-8.06a2.85 2.85 0 1 1 4.03 4.03l-8.06 8.08"/><path d="M7.07 14.94c-1.66 0-3 1.35-3 3.02 0 1.33-2.5 1.52-2 2.02 1.08 1.1 2.49 2.02 4 2.02 2.2 0 4-1.8 4-4.04a3.01 3.01 0 0 0-3-3.02z"/></svg></button>
    <button class="b" id="eraserB" title="Eraser (E)"><svg viewBox="0 0 24 24"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg></button>
  </div>
  <div class="grp" id="sws"><input type="color" id="well" value="#000000" title="Color"></div>
  <div class="grp"><input type="range" id="size" min="1" max="64" value="6" title="Brush Size ([ and ])"><span class="ro" id="sizeRo">6 px</span></div>
  <div class="grp"><input type="range" id="opac" min="1" max="100" value="100" title="Opacity (1 to 9, 0)"><span class="ro" id="opacRo">100%</span></div>
  <div class="grp">
    <button class="b" id="undoB" title="Undo (⌘Z)" disabled><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11"/></svg></button>
    <button class="b" id="redoB" title="Redo (⇧⌘Z)" disabled><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5A5.5 5.5 0 0 0 9.5 20H13"/></svg></button>
    <button class="b" id="clearB" title="Clear Canvas"><svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg></button>
  </div>
  <div class="sp"></div>
  <div class="grp">
    <button class="b" id="playB" title="Play Timelapse"><svg viewBox="0 0 24 24" id="playI"><polygon points="6 3 20 12 6 21 6 3"/></svg></button>
    <button class="b" id="exportB" title="Export"><svg viewBox="0 0 24 24"><path d="M12 2v13"/><path d="m16 6-4-4-4 4"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/></svg><svg class="chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
  </div>
  <div class="grp"><span id="dims"></span><button class="b" id="zoom" title="Toggle Fit and Actual Size">100%</button></div>
</div>
<div id="prog"><div id="bar"></div></div>
<div id="menu">
  <button data-ext="svg">Export as SVG</button>
  <button data-ext="png">Export as PNG<kbd>⌘E</kbd></button>
  <button data-ext="jpg">Export as JPEG</button>
</div>
<input type="file" id="fileIn" hidden>
<div id="ws"><div id="stage"><div id="frame"><canvas id="base"></canvas><canvas id="over"></canvas><div id="outline"><span></span></div></div></div></div>
<script>
const $=s=>document.querySelector(s);
const base=$('#base'),over=$('#over'),frame=$('#frame'),ws=$('#ws'),outline=$('#outline');
const bctx=base.getContext('2d'),octx=over.getContext('2d');
let dpr=Math.max(1,window.devicePixelRatio||1);
const S={doc:null,version:0,log:[],eff:[],redo:[],pending:[],initW:800,initH:600,bg:'#ffffff',w:800,h:600,zoom:1,tool:'brush',color:'#000000',size:6,opacity:100,playing:false,baking:false,bakeToken:0,loaded:false,polling:false,again:false};
const SWATCHES=['#000000','#ffffff','#ff3b30','#ff9500','#ffcc00','#34c759','#007aff','#8e8e93'];

function prep(c){c.setTransform(dpr,0,0,dpr,0,0);c.lineCap='round';c.lineJoin='round'}
function applyZoom(){frame.style.width=S.w*S.zoom+'px';frame.style.height=S.h*S.zoom+'px';$('#zoom').textContent=Math.round(S.zoom*100)+'%';$('#dims').textContent=S.w+' × '+S.h}
function sizeCanvas(w,h){S.w=w;S.h=h;for(const c of [base,over]){c.width=Math.max(1,Math.round(w*dpr));c.height=Math.max(1,Math.round(h*dpr))}prep(bctx);prep(octx);applyZoom()}
function fillBg(){bctx.fillStyle=S.bg;bctx.fillRect(0,0,S.w,S.h)}
function alphaOf(s){const o=s.opacity;return o==null?1:Math.min(1,Math.max(0,+o))}
function q255(o){return Math.round(o*255)}
function drawStroke(c,s,dx,dy){const p=s.points;if(!p||!p.length)return;c.strokeStyle=c.fillStyle=s.eraser?S.bg:s.color;c.lineWidth=s.width;c.globalAlpha=alphaOf(s);
  if(p.length===1){c.beginPath();c.arc(p[0][0]+dx,p[0][1]+dy,s.width/2,0,Math.PI*2);c.fill()}
  else{c.beginPath();c.moveTo(p[0][0]+dx,p[0][1]+dy);for(let i=1;i<p.length;i++)c.lineTo(p[i][0]+dx,p[i][1]+dy);c.stroke()}
  c.globalAlpha=1}
function layout(list){let w=S.initW,h=S.initH,ox=0,oy=0,items=[];
  for(const a of list){if(a.type==='stroke')items.push([a,ox,oy]);else if(a.type==='resize'){w+=a.left+a.right;h+=a.top+a.bottom;ox+=a.left;oy+=a.top}else if(a.type==='clear')items=[]}
  return{w:Math.max(1,Math.round(w)),h:Math.max(1,Math.round(h)),items:items.map(([s,x,y])=>({s,dx:ox-x,dy:oy-y}))}}
function rebake(){if(S.playing)return;const tok=++S.bakeToken;const L=layout(S.eff.concat(S.pending));sizeCanvas(L.w,L.h);fillBg();
  const it=L.items;if(it.length<=20000){for(const x of it)drawStroke(bctx,x.s,x.dx,x.dy);S.baking=false;return}
  S.baking=true;let i=0;const step=()=>{if(tok!==S.bakeToken)return;const end=Math.min(it.length,i+6000);for(;i<end;i++)drawStroke(bctx,it[i].s,it[i].dx,it[i].dy);if(i<it.length)requestAnimationFrame(step);else{S.baking=false;if(S.dirty){S.dirty=false;rebake()}}};step()}
function same(p,a){const x=p.points,y=a.points;if(p.color!==a.color||+p.width!==+a.width||!!p.eraser!==!!a.eraser||q255(alphaOf(p))!==q255(alphaOf(a))||!y||x.length!==y.length)return false;
  const n=x.length-1;return Math.abs(x[0][0]-y[0][0])<1e-3&&Math.abs(x[0][1]-y[0][1])<1e-3&&Math.abs(x[n][0]-y[n][0])<1e-3&&Math.abs(x[n][1]-y[n][1])<1e-3}
function ingest(entries,forceFull){let full=!!forceFull;const fresh=[];
  for(const a of entries){S.log.push(a);
    if(a.type==='undo'){if(S.eff.length){S.redo.push(S.eff.pop());full=true}}
    else if(a.type==='redo'){if(S.redo.length){S.eff.push(S.redo.pop());full=true}}
    else{S.redo=[];S.eff.push(a);if(a.type==='stroke'){const k=S.pending.findIndex(p=>same(p,a));if(k>=0)S.pending.splice(k,1);else fresh.push(a)}else full=true}}
  updateButtons();if(S.playing)return;
  if(full)rebake();else if(S.baking){if(fresh.length)S.dirty=true}else for(const a of fresh)drawStroke(bctx,a,0,0)}
function updateButtons(){$('#undoB').disabled=!S.eff.length;$('#redoB').disabled=!S.redo.length}
async function getJSON(u){const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(r.status);return r.json()}
async function poll(){if(S.polling){S.again=true;return}S.polling=true;
  try{let d=await getJSON('/api/actions?since='+S.version);let reset=false;
    if(d.doc!==S.doc||d.version<S.version){S.doc=d.doc;S.version=0;S.log=[];S.eff=[];S.redo=[];S.pending=[];reset=true;if(d.version&&d.actions.length<d.version)d=await getJSON('/api/actions?since=0');S.doc=d.doc}
    S.initW=d.initial_width;S.initH=d.initial_height;if(d.background&&d.background!==S.bg){S.bg=d.background;reset=true}
    const acts=d.actions||[];if(d.version>S.version||reset){S.version=d.version;ingest(acts,reset)}
    if(!S.loaded){S.loaded=true;fit(true)}
  }catch(e){}finally{S.polling=false;if(S.again){S.again=false;poll()}}}
function kick(){poll()}
function post(a){return fetch('/api/actions',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(a)}).then(kick,kick)}
function forceReset(){S.doc='\u0000';kick()}
setInterval(()=>{if(!document.hidden)poll()},200);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});

function setZoom(z,cx,cy){z=Math.min(16,Math.max(.05,z));const r=frame.getBoundingClientRect();if(cx==null){cx=r.left+r.width/2;cy=r.top+r.height/2}
  const fx=(cx-r.left)/S.zoom,fy=(cy-r.top)/S.zoom;S.zoom=z;applyZoom();const r2=frame.getBoundingClientRect();ws.scrollLeft+=r2.left+fx*z-cx;ws.scrollTop+=r2.top+fy*z-cy}
function fit(cap){const aw=ws.clientWidth-112,ah=ws.clientHeight-52-112;let z=Math.min(aw/S.w,ah/S.h);if(cap)z=Math.min(z,1);S.zoom=Math.max(.05,z);applyZoom();ws.scrollLeft=(ws.scrollWidth-ws.clientWidth)/2;ws.scrollTop=(ws.scrollHeight-ws.clientHeight)/2}
$('#zoom').onclick=()=>{if(Math.abs(S.zoom-1)<1e-3)fit(false);else{S.zoom=1;applyZoom()}};
ws.addEventListener('wheel',e=>{if(e.ctrlKey||e.metaKey){e.preventDefault();setZoom(S.zoom*Math.exp(-e.deltaY*.01),e.clientX,e.clientY)}},{passive:false});
let gz=1;
document.addEventListener('gesturestart',e=>{e.preventDefault();gz=S.zoom});
document.addEventListener('gesturechange',e=>{e.preventDefault();setZoom(gz*e.scale,e.clientX,e.clientY)});
window.addEventListener('resize',()=>{const d=Math.max(1,window.devicePixelRatio||1);if(d!==dpr){dpr=d;rebake()}});

let cur=null,pinch=null;const touches=new Map();
function q(v){return Math.round(v*16)/16}
function pt(e){const r=over.getBoundingClientRect();return[q((e.clientX-r.left)*S.w/r.width),q((e.clientY-r.top)*S.h/r.height)]}
function clearOver(){octx.clearRect(0,0,S.w,S.h)}
function addPt(e){const s=cur.s,p=pt(e),P=s.points,l=P[P.length-1];if(l&&Math.hypot(p[0]-l[0],p[1]-l[1])<.5)return;P.push(p);
  octx.strokeStyle=octx.fillStyle=s.eraser?S.bg:s.color;octx.lineWidth=s.width;
  if(!l){octx.beginPath();octx.arc(p[0],p[1],s.width/2,0,Math.PI*2);octx.fill()}else{octx.beginPath();octx.moveTo(l[0],l[1]);octx.lineTo(p[0],p[1]);octx.stroke()}}
function pinchDist(){const v=[...touches.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)}
function pinchMid(){const v=[...touches.values()];return[(v[0].x+v[1].x)/2,(v[0].y+v[1].y)/2]}
over.addEventListener('pointerdown',e=>{if(S.playing)return;
  if(e.pointerType==='touch'){touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(touches.size===2){cur=null;clearOver();pinch={d:pinchDist(),z:S.zoom};return}if(touches.size>2)return}
  if(e.pointerType==='mouse'&&e.button!==0)return;
  over.setPointerCapture(e.pointerId);cur={id:e.pointerId,s:{type:'stroke',color:S.color,width:S.size,opacity:q255(S.opacity/100)/255,points:[],eraser:S.tool==='eraser'}};over.style.opacity=cur.s.opacity;prep(octx);clearOver();addPt(e)});
over.addEventListener('pointermove',e=>{if(touches.has(e.pointerId)){touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pinch&&touches.size===2){const m=pinchMid();setZoom(pinch.z*pinchDist()/pinch.d,m[0],m[1]);return}}
  if(!cur||e.pointerId!==cur.id)return;const evs=e.getCoalescedEvents?e.getCoalescedEvents():[];for(const ev of evs.length?evs:[e])addPt(ev)});
function endPtr(e){touches.delete(e.pointerId);if(pinch&&touches.size<2)pinch=null;if(!cur||e.pointerId!==cur.id)return;const s=cur.s;cur=null;clearOver();
  if(e.type!=='pointerup'||!s.points.length)return;S.pending.push(s);if(S.baking)S.dirty=true;else drawStroke(bctx,s,0,0);post(s)}
over.addEventListener('pointerup',endPtr);over.addEventListener('pointercancel',endPtr);

for(const side of ['l','r','t','b']){const h=document.createElement('div');h.className='handle h'+side;h.title='Drag to resize canvas';frame.appendChild(h);
  h.addEventListener('pointerdown',e=>{if(S.playing||e.button>0)return;e.preventDefault();h.setPointerCapture(e.pointerId);const sx=e.clientX,sy=e.clientY;let d={left:0,top:0,right:0,bottom:0};showOutline(d);
    const mv=ev=>{const dx=Math.round((ev.clientX-sx)/S.zoom),dy=Math.round((ev.clientY-sy)/S.zoom);d={left:0,top:0,right:0,bottom:0};
      if(side==='l')d.left=Math.max(-dx,1-S.w);if(side==='r')d.right=Math.max(dx,1-S.w);if(side==='t')d.top=Math.max(-dy,1-S.h);if(side==='b')d.bottom=Math.max(dy,1-S.h);showOutline(d)};
    const up=ev=>{h.removeEventListener('pointermove',mv);h.removeEventListener('pointerup',up);h.removeEventListener('pointercancel',up);outline.style.display='none';
      if(ev.type==='pointerup'&&(d.left||d.top||d.right||d.bottom))post({type:'resize',left:d.left,top:d.top,right:d.right,bottom:d.bottom})};
    h.addEventListener('pointermove',mv);h.addEventListener('pointerup',up);h.addEventListener('pointercancel',up)})}
function showOutline(d){const z=S.zoom,w=S.w+d.left+d.right,hh=S.h+d.top+d.bottom;Object.assign(outline.style,{display:'block',left:-d.left*z+'px',top:-d.top*z+'px',width:w*z+'px',height:hh*z+'px'});outline.firstChild.textContent=w+' × '+hh}

function setTool(t){S.tool=t;$('#brushB').classList.toggle('on',t==='brush');$('#eraserB').classList.toggle('on',t==='eraser')}
function setSize(v){S.size=Math.min(64,Math.max(1,Math.round(v)));$('#size').value=S.size;$('#sizeRo').textContent=S.size+' px'}
function setOpacity(v){S.opacity=Math.min(100,Math.max(1,Math.round(v)));$('#opac').value=S.opacity;$('#opacRo').textContent=S.opacity+'%'}
function setColor(c){S.color=c.toLowerCase();$('#well').value=S.color;document.querySelectorAll('.sw').forEach(b=>b.classList.toggle('on',b.dataset.c===S.color));if(S.tool==='eraser')setTool('brush')}
const swsEl=$('#sws'),well=$('#well');
for(const c of SWATCHES){const b=document.createElement('button');b.className='sw';b.dataset.c=c;b.style.background=c;b.title=c;b.onclick=()=>setColor(c);swsEl.insertBefore(b,well)}
well.addEventListener('input',()=>setColor(well.value));
$('#brushB').onclick=()=>setTool('brush');$('#eraserB').onclick=()=>setTool('eraser');
$('#size').addEventListener('input',e=>setSize(+e.target.value));
$('#opac').addEventListener('input',e=>setOpacity(+e.target.value));
$('#undoB').onclick=()=>post({type:'undo'});$('#redoB').onclick=()=>post({type:'redo'});$('#clearB').onclick=()=>post({type:'clear'});

function download(url,name){const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove()}
function saveProject(){download('/api/project','Untitled.paint')}
function exportAs(ext){download('/api/export.'+ext,'Untitled.'+ext)}
$('#saveB').onclick=saveProject;
const fileIn=$('#fileIn');$('#openB').onclick=()=>fileIn.click();
fileIn.addEventListener('change',async()=>{const f=fileIn.files[0];fileIn.value='';if(!f)return;try{const r=await fetch('/api/project',{method:'POST',headers:{'content-type':'application/octet-stream'},body:f});if(!r.ok)throw 0;S.loaded=false;forceReset()}catch(e){alert('The project could not be opened.')}});
$('#newB').onclick=async()=>{if(!confirm('Start a new canvas? Unsaved changes to the current painting will be lost.'))return;
  await fetch('/api/new',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({width:S.w,height:S.h,background:S.bg})}).catch(()=>{});S.loaded=false;forceReset()};

const menu=$('#menu'),exportB=$('#exportB');
function closeMenu(){menu.style.display='none';exportB.classList.remove('open')}
exportB.onclick=e=>{e.stopPropagation();if(menu.style.display==='block')return closeMenu();const r=exportB.getBoundingClientRect();menu.style.display='block';menu.style.top=r.bottom+4+'px';menu.style.left=Math.min(r.left,innerWidth-menu.offsetWidth-8)+'px';exportB.classList.add('open')};
menu.addEventListener('click',e=>{const b=e.target.closest('button');if(b){exportAs(b.dataset.ext);closeMenu()}});
document.addEventListener('pointerdown',e=>{if(!menu.contains(e.target)&&!exportB.contains(e.target))closeMenu()});

const playI=$('#playI'),prog=$('#prog'),bar=$('#bar');
const PLAY='<polygon points="6 3 20 12 6 21 6 3"/>',STOP='<rect x="5" y="5" width="14" height="14" rx="2"/>';
function play(){if(S.playing)return stopPlay();const list=S.eff.slice();if(!list.length)return;S.playing=true;S.bakeToken++;S.baking=false;cur=null;
  playI.innerHTML=STOP;$('#playB').title='Stop Timelapse';prog.style.display='block';bar.style.width='0';
  let w=S.initW,h=S.initH,i=0;sizeCanvas(w,h);fillBg();
  const step=()=>{if(!S.playing)return;const a=list[i++];
    if(a.type==='stroke')drawStroke(bctx,a,0,0);
    else if(a.type==='clear')fillBg();
    else if(a.type==='resize'){const t=document.createElement('canvas');t.width=base.width;t.height=base.height;t.getContext('2d').drawImage(base,0,0);
      w=Math.max(1,Math.round(w+a.left+a.right));h=Math.max(1,Math.round(h+a.top+a.bottom));sizeCanvas(w,h);fillBg();bctx.drawImage(t,a.left,a.top,t.width/dpr,t.height/dpr)}
    bar.style.width=i/list.length*100+'%';if(i<list.length)requestAnimationFrame(step);else setTimeout(()=>{if(S.playing)stopPlay()},700)};
  requestAnimationFrame(step)}
function stopPlay(){S.playing=false;playI.innerHTML=PLAY;$('#playB').title='Play Timelapse';prog.style.display='none';rebake()}
$('#playB').onclick=play;

addEventListener('keydown',e=>{const m=e.metaKey||e.ctrlKey,k=e.key.toLowerCase();
  if(m&&k==='z'){e.preventDefault();post({type:e.shiftKey?'redo':'undo'});return}
  if(m&&k==='s'){e.preventDefault();saveProject();return}
  if(m&&k==='e'){e.preventDefault();exportAs('png');return}
  if(m&&k==='o'){e.preventDefault();fileIn.click();return}
  if(m&&(k==='0'||k==='1')){e.preventDefault();if(k==='0')fit(false);else{S.zoom=1;applyZoom()}return}
  if(m||e.altKey)return;
  if(e.key==='Escape'){closeMenu();if(S.playing)stopPlay();return}
  if(/^[0-9]$/.test(e.key)&&!(e.target.closest&&e.target.closest('input,textarea,select'))){setOpacity(e.key==='0'?100:+e.key*10);return}
  if(k==='b')setTool('brush');else if(k==='e')setTool('eraser');
  else if(e.key==='[')setSize(S.size-(S.size>16?4:S.size>6?2:1));else if(e.key===']')setSize(S.size+(S.size>=16?4:S.size>=6?2:1))});

setColor('#000000');setSize(6);setOpacity(100);sizeCanvas(S.w,S.h);fillBg();poll();
</script>
</body>
</html>
